plugins { id 'com.android.application' }

android {
    namespace 'com.offworkpet.receiver'
    compileSdk 35
    defaultConfig {
        applicationId 'com.offworkpet.receiver'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.1.7'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
        buildConfigField 'String', 'RELAY_URL', '"http://106.54.27.8"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}

tasks.register('writeProbeClasspath') {
    dependsOn 'compileDebugUnitTestJavaWithJavac'
    doLast {
        def output = rootProject.file('outputs/relay-probe-classpath.txt')
        output.parentFile.mkdirs()
        output.text = tasks.named('testDebugUnitTest').get().classpath.asPath
    }
}
